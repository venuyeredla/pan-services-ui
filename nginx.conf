worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # Root for your static UI files
        # root /usr/local/openresty/nginx/html; # Default OpenResty HTML root
        root /usr/share/app;

        # This location block handles all requests to the UI
        location / {
            # Add a custom header using Lua
            # This Lua code runs *before* NGINX attempts to serve the file
            access_by_lua_block {
                ngx.header["X-Served-By-OpenResty"] = "true";
                ngx.log(ngx.INFO, "Serving UI request for: ", ngx.var.uri);
            }

            # Try to serve the requested URI as a file, then as a directory,
            # otherwise return the main index.html for SPAs or a 404.
            try_files $uri $uri/ /index.html;
        }

        # Optimized caching for static assets (optional, but good practice)
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|pdf|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Example: Serve a dynamic endpoint using Lua (e.g., for UI to call)
        # Generate catch all API endpoint
        location /api/ {
            proxy_pass http://192.168.68.101:2024;  # Replace with your API's address
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}